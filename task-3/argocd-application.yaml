apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eshope
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:your-org/eshop-k8s.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: eshope
  syncPolicy:
    automated: {prune: true, selfHeal: true}
