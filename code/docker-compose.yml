version: "3.9"
services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: eshopedb
      POSTGRES_USER: eshope
      POSTGRES_PASSWORD: change-me
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./backend
    image: eshope/api:v1
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: eshopedb
      POSTGRES_USER: eshope
      POSTGRES_PASSWORD: change-me
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    image: eshope/frontend:v1
    environment:
      API_URL: http://api:5000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
