apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: eshope
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
      - name: frontend
        image: eshope/frontend:v1
        ports: [{containerPort: 80}]
        env:
        - name: API_URL
          valueFrom: {configMapKeyRef: {name: app-config, key: API_URL}}
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: eshope
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports:
  - port: 80
    targetPort: 80
