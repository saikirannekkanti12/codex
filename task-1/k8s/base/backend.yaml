apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: eshope
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:13-alpine
        command: ["sh","-c","until pg_isready -h postgres-service -p 5432; do sleep 2; done"]
      containers:
      - name: api
        image: eshope/api:v1
        ports: [{containerPort: 5000}]
        env:
        - name: DB_HOST
          value: postgres-service
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_DB}}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_USER}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}}
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        readinessProbe:
          httpGet: {path: /healthz, port: 5000}
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 5000}
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: eshope
spec:
  selector: {app: api}
  ports:
  - port: 5000
    targetPort: 5000
